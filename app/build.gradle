plugins {
    id 'com.android.application'
}

layout.buildDirectory.set(rootProject.layout.buildDirectory.dir('app'))

tasks.register('verifyDesktopInputs', Exec) {
    commandLine 'python3', rootProject.file('tools/verify/verify-artifacts.py').absolutePath
}

// Keep generated images out of source assets; the packaged asset name is stable.
tasks.register('prepareRootfsAsset', Sync) {
    dependsOn 'verifyDesktopInputs'
    from(rootProject.file('dist/rootfs.manifest.json')) {
        rename { 'image.json' }
        into 'rootfs'
    }
    into rootProject.layout.buildDirectory.dir('generated/assets')
}

tasks.named('preBuild').configure {
    dependsOn 'prepareRootfsAsset'
}

android {
    namespace 'org.debiannoroot'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'org.debiannoroot'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0-dev'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ''
                arguments '-DANDROID_STL=none', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    // Language switching is available offline, including bundle installations.
    bundle {
        language { enableSplit = false }
    }

    buildTypes {
        // Install alongside the user's app for destructive first-run acceptance.
        acceptance {
            initWith debug
            applicationIdSuffix '.acceptance'
            versionNameSuffix '-acceptance'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
            buildStagingDirectory rootProject.file('build/native')
        }
    }

    sourceSets {
        main {
            assets.srcDirs = [rootProject.file('assets'),
                              rootProject.file('build/generated/assets')]
            jniLibs.srcDirs = [rootProject.file('dist/runtime')]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so', '**/libXlorie.so']
        }
    }

    androidResources {
        noCompress += ['xz']
    }
}

dependencies {
    compileOnly files(rootProject.file('build/x11/annotations.jar'))
}
